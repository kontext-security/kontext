# Keep in sync with .goreleaser.yaml — a copy only because the private
# staging workflow pins this filename; the build matrix must match prod.
version: 2

project_name: kontext

builds:
  - main: ./cmd/kontext
    binary: kontext
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

# Sign the macOS binaries with the Developer ID certificate and notarize them,
# so Gatekeeper accepts them when a Homebrew cask or a browser download
# quarantines the file. Off until the MACOS_* secrets exist, so releases keep
# shipping (ad-hoc signed, as before) until then. Runs on Linux via quill.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# The private kontext-staging-releases workflow runs this configuration
# with --skip=publish, transfers only the archives to a fresh runner, and
# publishes them with that repository's own short-lived GITHUB_TOKEN.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^ci:"
      - "^chore:"
