name: Windows Package

# Builds kontext.exe and kontextw.exe with .goreleaser.windows.yaml and the
# MSIs in packaging/windows with WiX v7, and uploads them as an artifact.
# Also builds the release's archives from .goreleaser.yaml as a snapshot and
# checks the Windows zips, since nothing else runs that configuration before
# a release does. Nothing is published. Not a required check.
#
# Signing runs here the way a release runs it (scripts/sign-windows.sh, then
# scripts/verify-windows-signature.ps1), so the path is tried before a
# release depends on it. On a pull request or a branch the signature is a
# test signature from a certificate made for that run, which proves the
# steps and nothing about who signed. A run on main uses the real signature
# once the repository variable WINDOWS_SIGNING is artifact-signing: that is
# the rehearsal, and its output is an artifact, not a release.

on:
  pull_request:
    paths:
      - "packaging/windows/**"
      - ".goreleaser.yaml"
      - ".goreleaser.windows.yaml"
      - ".github/workflows/windows-package.yml"
      - ".github/actions/windows-signing-setup/**"
      - "scripts/sign-windows.sh"
      - "scripts/verify-windows-signature.ps1"
  push:
    branches:
      - main
    paths:
      - "packaging/windows/**"
      - ".goreleaser.yaml"
      - ".goreleaser.windows.yaml"
      - ".github/workflows/windows-package.yml"
      - ".github/actions/windows-signing-setup/**"
      - "scripts/sign-windows.sh"
      - "scripts/verify-windows-signature.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # WiX v7 as a .NET tool: windows-latest ships only WiX 3.
  WIX_VERSION: "7.0.1"
  # The real signature only on main and only when it is switched on;
  # otherwise the test signature.
  WINDOWS_SIGNING: ${{ (github.ref == 'refs/heads/main' && vars.WINDOWS_SIGNING == 'artifact-signing') && 'artifact-signing' || 'test' }}

jobs:
  # The archives a release would publish, built the way the release builds
  # them but without publishing, and the Windows zips among them checked.
  release-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing identity is bound to this environment; it is named only
    # when the real signature is asked for.
    environment: ${{ (github.ref == 'refs/heads/main' && vars.WINDOWS_SIGNING == 'artifact-signing') && 'windows-signing' || '' }}
    permissions:
      contents: read
      # For the sign-in to Azure, which uses this job's identity token.
      id-token: write
    env:
      WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
      WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser derives the snapshot version from the tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up signing
        uses: ./.github/actions/windows-signing-setup
        with:
          mode: ${{ env.WINDOWS_SIGNING }}
          azure-tenant-id: ${{ vars.WINDOWS_SIGNING_TENANT_ID }}
          azure-client-id: ${{ vars.WINDOWS_SIGNING_CLIENT_ID }}

      - name: Build the release archives
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2.18"
          args: release --snapshot --clean --skip=publish

      - name: Check the archives
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l *.tar.gz *.zip checksums.txt
          fail() { echo "::error::$1"; exit 1; }
          # What a release has shipped so far is still there, once each.
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            [ "$(ls kontext_*_"$target".tar.gz | wc -l)" -eq 1 ] || fail "want one archive for $target"
          done
          # One zip per Windows architecture, holding both programs.
          for arch in amd64 arm64; do
            zip="$(ls kontext_*_windows_"$arch".zip)"
            [ "$(echo "$zip" | wc -l)" -eq 1 ] || fail "want one zip for windows_$arch, got: $zip"
            names="$(unzip -Z1 "$zip")"
            for program in kontext.exe kontextw.exe; do
              echo "$names" | grep -qx "$program" || fail "$zip has no $program: $names"
            done
            grep -q "  $zip\$" checksums.txt || fail "checksums.txt does not list $zip"
            sha256sum --check --ignore-missing checksums.txt | grep -q "^$zip: OK\$" || fail "$zip does not match its checksum"
            # The CLI is a console program and the daemon a GUI one, both for this architecture.
            unzip -q -o "$zip" kontext.exe kontextw.exe -d "check-$arch"
            file "check-$arch/kontext.exe" "check-$arch/kontextw.exe"
            # The file tool spells the arm64 machine "Aarch64" or "ARM64", by version.
            machine="x86-64"; [ "$arch" = arm64 ] && machine="(Aarch64|ARM64)"
            file "check-$arch/kontext.exe" | grep -Eq "\(console\),? $machine" || fail "kontext.exe in $zip is not a console program for $arch"
            file "check-$arch/kontextw.exe" | grep -Eq "\(GUI\),? $machine" || fail "kontextw.exe in $zip is not a GUI program for $arch"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kontext-windows-zip
          path: |
            dist/kontext_*_windows_*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  # The programs inside the zips, checked where Windows itself reads the
  # signature: the zips are built on Linux, which cannot.
  verify-archives:
    needs: release-archives
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kontext-windows-zip
          path: zips

      - name: Check the signatures of the programs in the zips
        shell: pwsh
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $programs = @()
          foreach ($zip in Get-ChildItem zips -Recurse -Filter 'kontext_*_windows_*.zip') {
            $to = Join-Path unpacked $zip.BaseName
            Expand-Archive $zip.FullName -DestinationPath $to
            $programs += Get-ChildItem $to -Filter '*.exe' | ForEach-Object FullName
          }
          if ($programs.Count -ne 4) { Write-Error "expected four programs in two zips, found $($programs.Count)"; exit 1 }
          ./scripts/verify-windows-signature.ps1 -Mode $env:WINDOWS_SIGNING -Subject "$env:WINDOWS_SIGNING_SUBJECT" @programs

  msi:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ (github.ref == 'refs/heads/main' && vars.WINDOWS_SIGNING == 'artifact-signing') && 'windows-signing' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
      WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
      WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser derives the snapshot version from the tags.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2.18"
          args: check --config .goreleaser.windows.yaml

      # The MSI's version is the last release's, and the executables report
      # the same one; Windows Installer reads only the first three fields.
      - name: Read the version
        shell: pwsh
        run: |
          $version = (Get-Content .release-please-manifest.json -Raw | ConvertFrom-Json).'.'
          Add-Content -Path $env:GITHUB_ENV -Value "KONTEXT_VERSION=$version"

      - name: Set up signing
        uses: ./.github/actions/windows-signing-setup
        with:
          mode: ${{ env.WINDOWS_SIGNING }}
          azure-tenant-id: ${{ vars.WINDOWS_SIGNING_TENANT_ID }}
          azure-client-id: ${{ vars.WINDOWS_SIGNING_CLIENT_ID }}

      # Each program is signed by its build's hook, before anything packs it.
      - name: Build the executables
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2.18"
          args: build --snapshot --clean --config .goreleaser.windows.yaml

      - name: Check the executables' version
        shell: pwsh
        run: |
          $reported = & dist\windows_amd64\kontext.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($reported -notmatch (" " + [regex]::Escape($env:KONTEXT_VERSION) + "( |$)")) {
            Write-Error "kontext.exe reports '$reported', the MSI is $env:KONTEXT_VERSION"
            exit 1
          }
          "kontext.exe: $reported"

      - name: Check the executables' signatures
        shell: pwsh
        run: |
          $programs = Get-ChildItem dist\windows_amd64\*.exe, dist\windows_arm64\*.exe | ForEach-Object FullName
          if ($programs.Count -ne 4) { Write-Error "expected four programs, found $($programs.Count)"; exit 1 }
          ./scripts/verify-windows-signature.ps1 -Mode $env:WINDOWS_SIGNING -Subject "$env:WINDOWS_SIGNING_SUBJECT" @programs

      - name: Install WiX
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install wix --version $env:WIX_VERSION --tool-path $tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          & (Join-Path $tools 'wix.exe') --version

      - name: Build the MSIs
        shell: pwsh
        run: |
          $version = $env:KONTEXT_VERSION
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($arch in @(@{ wix = 'x64'; go = 'amd64' }, @{ wix = 'arm64'; go = 'arm64' })) {
            $bin = Join-Path $PWD "dist\windows_$($arch.go)"
            $msi = Join-Path $PWD "out\kontext_$($version)_windows_$($arch.go).msi"
            # -acceptEula wix7 accepts the WiX v7 OSMF EULA for this build.
            wix build packaging/windows/Package.wxs -arch $arch.wix `
              -d "ProductVersion=$version" -d "BinDir=$bin" `
              -acceptEula wix7 -o $msi
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            wix msi validate -acceptEula wix7 $msi
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem out\*.msi | Format-Table Name, Length

      # The MSIs are signed after they are built and validated, and before
      # anything takes their checksum.
      - name: Sign the MSIs
        shell: bash
        run: bash scripts/sign-windows.sh out/*.msi

      - name: Check the MSIs' signatures
        shell: pwsh
        run: |
          $msis = Get-ChildItem out\*.msi | ForEach-Object FullName
          if ($msis.Count -ne 2) { Write-Error "expected two MSIs, found $($msis.Count)"; exit 1 }
          ./scripts/verify-windows-signature.ps1 -Mode $env:WINDOWS_SIGNING -Subject "$env:WINDOWS_SIGNING_SUBJECT" @msis

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kontext-windows-msi
          path: out/*.msi
          if-no-files-found: error
