name: Dependency Review

on:
  pull_request:
  # Required on main, so it must report in the merge queue too. The pull
  # request already reviewed the dependency diff; the queue run skips it,
  # which counts as passing.
  merge_group:

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ github.event.repository.private == false && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
