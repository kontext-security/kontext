name: Tool Catalog Refresh

# Checks the Jira/Atlassian, HubSpot, GitHub and Databricks MCP servers
# against upstream every week and opens a pull request when a source adds a
# tool, changes a tool's definition, or annotates a tool as stricter than its
# tier. New tools land as write (delete when annotated destructive);
# annotations never loosen a tier. A GitHub change re-pins the GitHub catalog
# to upstream HEAD. A new databricks/cli release regenerates the Databricks
# route table; operations upstream dropped are kept.
#
# The PR body lists every change and the refresh kind. A strict-only refresh
# (it only adds write-tier entries or raises tiers) is labelled
# catalog-strict-only and merges through the merge queue on its own; any
# other refresh asks @michiosw for review.
#
# Without the ATLASSIAN_MCP_AUTHORIZATION secret; the HUBSPOT_MCP_CLIENT_ID,
# HUBSPOT_MCP_CLIENT_SECRET and HUBSPOT_MCP_REFRESH_TOKEN secrets; or the
# DATABRICKS_HOST, DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET secrets
# and the DATABRICKS_MCP_ENDPOINTS variable, the hosted servers are skipped
# and reported as such; the other sources still refresh. A dispatch on any
# branch but the default one only reports.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  # A change to the catalogs or the refresh runs it as a dry run without
  # secrets: the report lands in the job summary and nothing is pushed.
  pull_request:
    paths:
      - internal/toolcatalog/providers/**
      - internal/toolcatalog/github-mcp.json
      - internal/toolcatalog/databricks-routes.json
      - scripts/toolcatalog-refresh/**
      - .github/workflows/tool-catalog-refresh.yml

# Read-only by default; only the scheduled refresh may push.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BRANCH: automation/tool-catalog-refresh

jobs:
  # Pull requests run their own code, so the dry run gets no secrets and no
  # write token. The hosted servers are skipped and reported as such.
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Dry run
        run: |
          set -euo pipefail
          go run ./scripts/toolcatalog-refresh -report "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pushes and the PR go through the catalog GitHub App's token, not
    # GITHUB_TOKEN: a PR opened with GITHUB_TOKEN starts no pull_request
    # workflows, so its required checks would never report.
    permissions:
      contents: read
    # Two refreshes never race on the branch.
    concurrency:
      group: tool-catalog-refresh
      cancel-in-progress: false
    steps:
      - name: Check the catalog App credentials
        env:
          CLIENT_ID: ${{ vars.CATALOG_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$CLIENT_ID" || -z "$PRIVATE_KEY" ]]; then
            echo "::error::Set the repository variable CATALOG_APP_CLIENT_ID and the secret CATALOG_APP_PRIVATE_KEY for the catalog GitHub App; the refresh opens its PR with that App so CI runs on it."
            exit 1
          fi

      - name: Mint the catalog App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Continue the open refresh PR
        id: branch
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "/users/$bot" --jq .id)+$bot@users.noreply.github.com"
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [[ -n "$pr" ]]; then
            # Build on the open PR so a reviewer's tier edits are kept.
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit "origin/${{ github.event.repository.default_branch }}"
          else
            git checkout -B "$BRANCH"
          fi

      - name: Refresh catalogs
        env:
          ATLASSIAN_MCP_AUTHORIZATION: ${{ secrets.ATLASSIAN_MCP_AUTHORIZATION }}
          HUBSPOT_MCP_CLIENT_ID: ${{ secrets.HUBSPOT_MCP_CLIENT_ID }}
          HUBSPOT_MCP_CLIENT_SECRET: ${{ secrets.HUBSPOT_MCP_CLIENT_SECRET }}
          HUBSPOT_MCP_REFRESH_TOKEN: ${{ secrets.HUBSPOT_MCP_REFRESH_TOKEN }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_MCP_ENDPOINTS: ${{ vars.DATABRICKS_MCP_ENDPOINTS }}
        run: |
          set -euo pipefail
          go run ./scripts/toolcatalog-refresh -write -report "$RUNNER_TEMP/report.md" -kind "$RUNNER_TEMP/kind"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update pull request
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.branch.outputs.pr }}
        run: |
          set -euo pipefail
          if git diff --quiet -- internal/toolcatalog; then
            echo "No catalog changes."
            exit 0
          fi
          # The digest test pins the combined catalog; recompute it so the
          # PR builds, and leave the tier review to the reviewer.
          # The pin test fails exactly when the digest changed; that failure
          # is the expected path, so it must not abort the step.
          digest="$( (go test ./internal/toolcatalog -run TestCatalogDigestIsStable 2>&1 || true) | sed -n 's/.*Digest() = "\([0-9a-f]\{64\}\)".*/\1/p' | head -1)"
          if [[ -n "$digest" ]]; then
            old="$(sed -n 's/.*const want = "\([0-9a-f]\{64\}\)".*/\1/p' internal/toolcatalog/github_test.go)"
            grep -rl "$old" internal | xargs sed -i "s/$old/$digest/g"
          fi
          # Run the catalog's own checks before pushing, so a refresh that
          # breaks them never opens a PR.
          go test ./internal/toolcatalog/... ./internal/shellprojection/... ./internal/cedarpolicy/... ./internal/guard/app/server/... ./internal/managedobserve/... ./scripts/toolcatalog-refresh/...
          git add internal
          git commit -m "chore(toolcatalog): refresh tool catalogs"
          # A PR stays strict-only only while every run on it was: an
          # earlier run's change may still be waiting for review. Before
          # commits that need review land on a strict-only PR, stop it
          # merging; any failure here aborts before the push.
          kind="$(cat "$RUNNER_TEMP/kind")"
          if [[ -n "$PR" ]]; then
            # shellcheck disable=SC2016 # $o, $r and $n are GraphQL variables
            state="$(gh api graphql -F n="$PR" -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" \
              -f query='query($o: String!, $r: String!, $n: Int!) { repository(owner: $o, name: $r) { pullRequest(number: $n) { id isInMergeQueue autoMergeRequest { enabledAt } labels(first: 100) { nodes { name } } } } }' \
              --jq .data.repository.pullRequest)"
            labelled="$(jq '.labels.nodes | map(.name) | index("catalog-strict-only") != null' <<<"$state")"
            [[ "$labelled" == true ]] || kind=review
            if [[ "$kind" != strict-only ]]; then
              if [[ "$(jq .isInMergeQueue <<<"$state")" == true ]]; then
                # shellcheck disable=SC2016 # $id is a GraphQL variable
                gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$(jq -r .id <<<"$state")"
              fi
              if [[ "$(jq '.autoMergeRequest != null' <<<"$state")" == true ]]; then
                gh pr merge "$BRANCH" --disable-auto
              fi
              if [[ "$labelled" == true ]]; then
                gh pr edit "$BRANCH" --remove-label catalog-strict-only
              fi
            fi
          fi
          if [[ -n "$PR" ]]; then
            git push origin "$BRANCH"
            # Each run reports only what it changed, so keep every earlier
            # run's notes: a tier still waiting for review stays listed.
            {
              gh pr view "$BRANCH" --json body --jq .body
              printf '\n\n---\n\n_Run of %s:_\n\n' "$(date -u +%F)"
              cat "$RUNNER_TEMP/report.md"
            } > "$RUNNER_TEMP/body.md"
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            # No open PR: any branch left over from a closed one is stale.
            git push --force-with-lease origin "$BRANCH"
            gh pr create --head "$BRANCH" --title "chore(toolcatalog): refresh tool catalogs" \
              --body-file "$RUNNER_TEMP/report.md"
          fi
          if [[ "$(gh pr view "$BRANCH" --json isDraft --jq .isDraft)" == true ]]; then
            gh pr ready "$BRANCH"
          fi
          if [[ "$kind" == strict-only ]]; then
            gh pr edit "$BRANCH" --add-label catalog-strict-only
            gh pr merge "$BRANCH" --squash --auto
          else
            gh pr edit "$BRANCH" --add-reviewer michiosw
          fi

      # A Databricks check that failed (an SDK service with no product, a
      # server path with no product, an expired secret) fails the run, so it
      # is seen even when nothing else changed.
      - name: Fail on a failed Databricks check
        run: |
          if grep -E '^- Databricks.*check failed' "$RUNNER_TEMP/report.md"; then
            echo "::error::A Databricks check failed; see the job summary."
            exit 1
          fi
