name: Homebrew Install

# Installs kontext the way customers do, on the oldest macOS runner GitHub
# keeps (macos-14 retires 2026-11-02) and on Intel, where Homebrew has the
# fewest bottles. Pull requests test the formula and cask this commit renders;
# the schedule runs the exact published command.

on:
  pull_request:
    paths:
      - "scripts/render-homebrew-*.sh"
      - ".github/workflows/homebrew-install.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-install-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  GH_TOKEN: ${{ github.token }}
  # Sourced by bash steps through BASH_ENV.
  BASH_ENV: ${{ github.workspace }}/.homebrew-install-helpers.sh

jobs:
  rendered:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write shell helpers
        run: |
          cat > "$BASH_ENV" <<'HELPERS'
          # Move Xcode and the Command Line Tools away, like a Mac that never
          # installed them. On Intel, Homebrew itself refuses every install,
          # bottles and casks alike, without the Command Line Tools because it
          # needs codesign (Homebrew/brew#23418), so keep those there.
          hide_developer_tools() {
            local paths=(/Applications/Xcode*.app)
            if [[ "$(uname -m)" == "arm64" ]]; then
              paths+=(/Library/Developer/CommandLineTools)
            fi
            sudo mkdir -p /private/var/hidden-dev-tools
            for path in "${paths[@]}"; do
              if [[ -e "$path" ]]; then sudo mv "$path" /private/var/hidden-dev-tools/; fi
            done
          }
          # Whether the tap publishes the cask. Only an explicit 404 means "not
          # yet"; any other API failure must fail the job rather than skip
          # the check.
          cask_published() {
            local status
            status="$(gh api -i repos/kontext-security/homebrew-tap/contents/Casks/kontext.rb 2>/dev/null | head -1 | awk '{print $2}')"
            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::cannot tell whether the cask is published (HTTP ${status:-none})"; exit 1 ;;
            esac
          }
          # Apple's check for standalone binaries; spctl is meant for apps.
          # A bare binary cannot carry a stapled ticket, so this asks Apple
          # online; retry so one failed lookup does not fail the job.
          is_notarized() {
            for attempt in 1 2 3; do
              if codesign -vvvv -R="notarized" --check-notarization "$1"; then return 0; fi
              sleep 10
            done
            return 1
          }
          require_notarized() {
            if ! is_notarized "$1"; then
              echo "::error::$1 is not notarized"
              return 1
            fi
          }
          # Starts the binary the way launchd starts the daemon. A quarantined
          # binary started by launchd waits on Gatekeeper's "downloaded from
          # the internet" prompt, which nobody clicks.
          runs_from_launchd() {
            local binary="$1" version="$2" label="security.kontext.ci-launchd-check"
            local plist="$RUNNER_TEMP/launchd-check.plist" out="$RUNNER_TEMP/launchd.out" err="$RUNNER_TEMP/launchd.err"
            if xattr -p com.apple.quarantine "$binary" >/dev/null 2>&1; then
              echo "::error::$binary still has the quarantine attribute"
              return 1
            fi
            cat > "$plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>$label</string>
            <key>ProgramArguments</key><array><string>$binary</string><string>--version</string></array>
            <key>RunAtLoad</key><true/>
            <key>StandardOutPath</key><string>$out</string>
            <key>StandardErrorPath</key><string>$err</string>
          </dict></plist>
          PLIST
            launchctl bootstrap "gui/$(id -u)" "$plist"
            for _ in $(seq 30); do
              if grep -qF "kontext version $version " "$out" 2>/dev/null; then break; fi
              sleep 1
            done
            launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || true
            # stdout only: an error on stderr names the versioned path too.
            if ! grep -F "kontext version $version " "$out"; then
              echo "::error::$binary did not print its version from launchd within 30 seconds"
              cat "$err" 2>/dev/null || true
              return 1
            fi
          }
          HELPERS

      - name: Render formula and cask for the latest release
        run: |
          set -euo pipefail
          tag="$(gh release view --repo kontext-security/kontext --json tagName --jq .tagName)"
          version="${tag#v}"
          gh release download "$tag" --repo kontext-security/kontext -p checksums.txt -D "$RUNNER_TEMP"
          # The formulae live in a git tap with their real names, like
          # kontext-security/homebrew-tap: Homebrew 7 trusts only the formula
          # named on the command line, so a formula that loads its sibling
          # fails here exactly as it does for customers.
          repo="$RUNNER_TEMP/homebrew-tap"
          mkdir -p "$repo/Formula"
          ./scripts/render-homebrew-formula.sh "$version" "$RUNNER_TEMP/checksums.txt" > "$repo/Formula/kontext.rb"
          ./scripts/render-homebrew-formula.sh "$version" "$RUNNER_TEMP/checksums.txt" --staging > "$repo/Formula/kontext-staging.rb"
          git -C "$repo" init -q
          git -C "$repo" add -A
          git -C "$repo" -c user.name=ci -c user.email=ci@localhost commit -qm "rendered formulae"
          brew tap kontext/trust "$repo"
          brew tap-new --no-git kontext/ci
          tap="$(brew --repo kontext/ci)"
          mkdir -p "$tap/Casks"
          # Renamed so the cask can be installed next to the formula.
          ./scripts/render-homebrew-cask.sh "$version" "$RUNNER_TEMP/checksums.txt" \
            | sed -e 's/^cask "kontext" do/cask "kontext-cask" do/' \
                  -e 's/^  binary "kontext"$/  binary "kontext", target: "kontext-cask"/' > "$tap/Casks/kontext-cask.rb"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Formula installs from an untrusted tap with no dependencies
        run: |
          set -euo pipefail
          deps="$(brew deps --formula kontext/trust/kontext)"
          if [[ -n "$deps" ]]; then
            echo "::error::formula pulls dependencies: $deps"
            exit 1
          fi
          brew install kontext/trust/kontext 2>&1 | tee "$RUNNER_TEMP/formula.log"
          kontext --version | grep -F "$VERSION"
          brew uninstall --formula kontext

      - name: Cask installs without developer tools
        run: |
          set -euo pipefail
          hide_developer_tools
          brew install --cask kontext/ci/kontext-cask 2>&1 | tee "$RUNNER_TEMP/cask.log"
          binary="$(readlink -f "$(brew --prefix)/bin/kontext-cask")"
          # The release workflow publishes the cask only for notarized
          # releases, so a published cask means this release must verify.
          if cask_published; then
            require_notarized "$binary"
            kontext-cask --version | grep -F "$VERSION"
          elif is_notarized "$binary"; then
            kontext-cask --version | grep -F "$VERSION"
          else
            echo "::warning::$VERSION is not notarized and no cask is published yet; installed but not run"
          fi

      - name: Cask binary starts from launchd
        run: |
          set -euo pipefail
          runs_from_launchd "$(readlink -f "$(brew --prefix)/bin/kontext-cask")" "$VERSION"

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-install-${{ matrix.runner }}
          path: ${{ runner.temp }}/*.log

  published:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Write shell helpers
        run: |
          cat > "$BASH_ENV" <<'HELPERS'
          # Move Xcode and the Command Line Tools away, like a Mac that never
          # installed them. On Intel, Homebrew itself refuses every install,
          # bottles and casks alike, without the Command Line Tools because it
          # needs codesign (Homebrew/brew#23418), so keep those there.
          hide_developer_tools() {
            local paths=(/Applications/Xcode*.app)
            if [[ "$(uname -m)" == "arm64" ]]; then
              paths+=(/Library/Developer/CommandLineTools)
            fi
            sudo mkdir -p /private/var/hidden-dev-tools
            for path in "${paths[@]}"; do
              if [[ -e "$path" ]]; then sudo mv "$path" /private/var/hidden-dev-tools/; fi
            done
          }
          # Whether the tap publishes the cask. Only an explicit 404 means "not
          # yet"; any other API failure must fail the job rather than skip
          # the check.
          cask_published() {
            local status
            status="$(gh api -i repos/kontext-security/homebrew-tap/contents/Casks/kontext.rb 2>/dev/null | head -1 | awk '{print $2}')"
            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::cannot tell whether the cask is published (HTTP ${status:-none})"; exit 1 ;;
            esac
          }
          # Apple's check for standalone binaries; spctl is meant for apps.
          # A bare binary cannot carry a stapled ticket, so this asks Apple
          # online; retry so one failed lookup does not fail the job.
          is_notarized() {
            for attempt in 1 2 3; do
              if codesign -vvvv -R="notarized" --check-notarization "$1"; then return 0; fi
              sleep 10
            done
            return 1
          }
          require_notarized() {
            if ! is_notarized "$1"; then
              echo "::error::$1 is not notarized"
              return 1
            fi
          }
          # Starts the binary the way launchd starts the daemon. A quarantined
          # binary started by launchd waits on Gatekeeper's "downloaded from
          # the internet" prompt, which nobody clicks.
          runs_from_launchd() {
            local binary="$1" version="$2" label="security.kontext.ci-launchd-check"
            local plist="$RUNNER_TEMP/launchd-check.plist" out="$RUNNER_TEMP/launchd.out" err="$RUNNER_TEMP/launchd.err"
            if xattr -p com.apple.quarantine "$binary" >/dev/null 2>&1; then
              echo "::error::$binary still has the quarantine attribute"
              return 1
            fi
            cat > "$plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>$label</string>
            <key>ProgramArguments</key><array><string>$binary</string><string>--version</string></array>
            <key>RunAtLoad</key><true/>
            <key>StandardOutPath</key><string>$out</string>
            <key>StandardErrorPath</key><string>$err</string>
          </dict></plist>
          PLIST
            launchctl bootstrap "gui/$(id -u)" "$plist"
            for _ in $(seq 30); do
              if grep -qF "kontext version $version " "$out" 2>/dev/null; then break; fi
              sleep 1
            done
            launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || true
            # stdout only: an error on stderr names the versioned path too.
            if ! grep -F "kontext version $version " "$out"; then
              echo "::error::$binary did not print its version from launchd within 30 seconds"
              cat "$err" 2>/dev/null || true
              return 1
            fi
          }
          HELPERS

      - name: Install with the command from the dashboard
        run: |
          set -euo pipefail
          brew install kontext-security/tap/kontext 2>&1 | tee "$RUNNER_TEMP/published.log"
          kontext --version

      - name: Daemon updater commands work against the published formula
        run: |
          set -euo pipefail
          # The daemon auto-updater runs these. Releases up to 1.11 omit
          # --formula; with a same-name cask in an untrusted tap that must
          # still resolve, or older installs stop updating.
          brew list --versions kontext-security/tap/kontext
          brew list --formula --versions kontext-security/tap/kontext
          brew upgrade --formula --no-ask kontext-security/tap/kontext
          brew uninstall --formula kontext

      - name: Install the published cask without developer tools
        run: |
          set -euo pipefail
          if ! cask_published; then
            echo "No cask published yet"
            exit 0
          fi
          hide_developer_tools
          brew install --cask kontext-security/tap/kontext 2>&1 | tee -a "$RUNNER_TEMP/published.log"
          require_notarized "$(readlink -f "$(brew --prefix)/bin/kontext")"
          kontext --version
          # Casks published before the quarantine fix have no preflight_steps.
          if brew cat --cask kontext-security/tap/kontext | grep -q preflight_steps; then
            runs_from_launchd "$(readlink -f "$(brew --prefix)/bin/kontext")" "$(brew list --cask --versions kontext | awk '{print $NF}')"
          else
            echo "::warning::the published cask predates the quarantine fix; launchd check skipped"
          fi
          # What the daemon updater runs for a cask install.
          brew list --cask --versions kontext
          brew upgrade --cask --no-ask kontext-security/tap/kontext

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-published-${{ matrix.runner }}
          path: ${{ runner.temp }}/published.log
