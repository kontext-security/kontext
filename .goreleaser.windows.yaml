# Windows executables for the MSI in packaging/windows, built by
# .github/workflows/windows-package.yml. Kept apart from .goreleaser.yaml
# because the MSI is not a release asset yet; a release ships the same two
# programs as a zip, built by .goreleaser.yaml. The builds here follow the
# Windows builds there; keep them in sync.
#
#   goreleaser build --snapshot --clean --config .goreleaser.windows.yaml
#
# writes dist/windows_<arch>/kontext.exe and dist/windows_<arch>/kontextw.exe.
version: 2

project_name: kontext

# A snapshot reports the version the workflow gives the MSI, so the package and
# its executables agree; without KONTEXT_VERSION, GoReleaser's usual snapshot
# version.
snapshot:
  version_template: '{{ if index .Env "KONTEXT_VERSION" }}{{ .Env.KONTEXT_VERSION }}{{ else }}{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}{{ end }}'

builds:
  # The CLI and the hook command: a console program. It leaves out the
  # step-safety model, which only the daemon (kontextw.exe) loads, so the
  # installer carries the model once.
  - id: kontext
    main: ./cmd/kontext
    binary: "windows_{{ .Arch }}/kontext"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - nostepsafetymodel
    ldflags:
      - -s -w -X main.version={{.Version}}

  # The same program linked for the GUI subsystem, so the logon task that
  # starts the daemon opens no console window.
  - id: kontextw
    main: ./cmd/kontext
    binary: "windows_{{ .Arch }}/kontextw"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -H windowsgui

# Builds only: this file must never publish a release.
release:
  disable: true

changelog:
  disable: true
